# Chartula configuration: copy to chartula.yaml and uncomment what you need.
# Every key, its default and its valid values: docs/configuration.md
# Environment variables override this file (Chartula__Section__Key).
# Endpoints and key variable names are environment-only and refused here:
# docs/configuration.md, "Environment-only settings".

# The model. Setup per provider: docs/providers.md
# llm:
#   provider: anthropic              # anthropic or openai-compatible
#   model: claude-sonnet-5           # required with openai-compatible
#   maxOutputTokens: 32000           # per call, thinking included
#   thinking: provider-default       # docs/providers.md, "thinking"

# GitHub has no keys here: docs/github.md

# Label rules: docs/what-goes-into-a-release.md
# labels:
#   exclude: [wontfix, duplicate]    # drop these pull requests
#   category:
#     security: Fix                  # force a category by label
#   onlyIncludeLabeled: false        # true drops unlabeled changes
#   internal: [visibility:internal]  # kept out of the customer rendering
#   userFacing: [visibility:user-facing]
#   actionRequired: [needs-migration]

# filter:
#   excludeCategories: [Internal]    # a list replaces the default

# factBase:
#   depth: title-and-description     # title-only, title-and-description

# categories:
#   order: [Feature, Fix, Performance, Documentation, Refactor, Other, Internal]
#   names:
#     Fix: Bug Fix                   # the name the model is given, not a heading
#   breakingProminent: true          # product rendering only

# The checks: docs/costs-and-checks.md
# faithfulness:
#   thorough: true
#   model: claude-sonnet-5           # defaults to llm.model
#   thinking: disabled               # defaults to llm.thinking

# review:
#   enabled: false                   # only false is accepted

# Confirming a large range: docs/what-goes-into-a-release.md
# range:
#   confirmAboveCommits: 200         # a larger range, or a first tag, is confirmed first
