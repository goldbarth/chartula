# Chartula configuration - copy to chartula.yaml to use.
#
# Chartula runs with sensible defaults, so this file is optional and only exists
# to refine that default behavior. Everything below is commented out; uncomment
# and change only what you need. Full options are documented in
# docs/configuration.md.
#
# Every setting can also be given as an environment variable, which overrides
# this file: Chartula__Section__Key, for example Chartula__Faithfulness__Thorough.
#
# API keys and tokens are never read from this file, and neither are the
# endpoints or the names of the variables holding the keys: those decide where
# release data and credentials go, so they come from the environment only
# (Chartula__Llm__BaseUrl, Chartula__Llm__ApiKeyEnvironmentVariable,
# Chartula__GitHub__ApiBaseUrl, Chartula__GitHub__TokenEnvironmentVariable).
# A file that sets one is refused. See docs/configuration.md,
# "Environment-only settings".

# The model provider and which model to use. maxOutputTokens caps what the model
# may produce per call; raise it for releases whose changelog runs long.
# The default is claude-sonnet-5; another model is a config change, not a code
# change - claude-haiku-4-5 is cheaper, claude-opus-5 the top tier. See
# docs/configuration.md, "Choosing a model".
# llm:
#   provider: anthropic
#   model: claude-sonnet-5
#   maxOutputTokens: 16000
# thinking is provider-default, disabled, low, medium, high or xhigh, and means the
# same on every provider. The default sends nothing and lets each model decide, and
# models decide differently - thinking bills as output tokens, so set it explicitly
# if you want the same behavior on every model.
#   thinking: provider-default

# provider: openai-compatible reaches anything speaking the OpenAI chat-completions
# dialect at the URL in Chartula__Llm__BaseUrl. Experimental - see
# docs/configuration.md, "Running against your own endpoint". Neither the model
# nor the endpoint has a default there, so both are required.
#
# Your own machine, where the release data never leaves it (Ollama here; LM Studio
# is http://localhost:1234/v1). No API key is involved - local servers do not read
# the Authorization header.
# llm:
#   provider: openai-compatible
#   model: qwen3:8b
# with: export Chartula__Llm__BaseUrl=http://localhost:11434/v1
#
# A hosted endpoint instead, which does need a key:
# llm:
#   provider: openai-compatible
#   model: llama-3.3-70b-versatile
# with: export Chartula__Llm__BaseUrl=https://api.groq.com/openai/v1
#       export Chartula__Llm__ApiKeyEnvironmentVariable=GROQ_API_KEY
#
# Watch the thorough faithfulness check here: an endpoint may accept the request and
# ignore the JSON schema. An unreadable verdict is reported as not evaluated, never
# as a clean check, so you find out rather than being told the text passed.

# The GitHub API is reached at https://api.github.com/ with the token in
# GITHUB_TOKEN. For GitHub Enterprise, set Chartula__GitHub__ApiBaseUrl.

# Steer curation with GitHub labels. With no rules, labels are ignored.
# labels:
#   exclude: [wontfix, duplicate]
#   category:
#     security: Fix
#   onlyIncludeLabeled: false
# Which changes a reader can come into contact with. The names are your
# convention, not the tool's. A breaking change is always user-facing, and a
# change carrying neither label falls back to its category - so labelling
# nothing leaves the customer changelog exactly as it is.
#   internal: [visibility:internal]
#   userFacing: [visibility:user-facing]

# Which categories are dropped from the changelog. An explicit list replaces
# the default.
# filter:
#   excludeCategories: [Internal]

# How much source material feeds the fact base.
# One of: title-only, title-and-description, title-description-and-issues.
# factBase:
#   depth: title-and-description

# How categories are presented in the output.
# categories:
#   order: [Feature, Fix, Performance, Documentation, Refactor, Other, Internal]
#   names:
#     Fix: Bug Fixes
#   breakingProminent: true

# The faithfulness checks. The rule-based check always runs and is not
# configurable. See docs/run-metrics.md for judging whether the thorough
# check earns its tokens.
# faithfulness:
#   thorough: true
# The thorough check can ask its own model, at the same provider and endpoint -
# render with a cheaper model and check with a stronger one, or the reverse.
# thinking takes the values of llm.thinking. Both default to what llm says.
#   model: claude-opus-5
#   thinking: disabled

# Review mode - present generated texts for sign-off before writing.
# review:
#   enabled: false
