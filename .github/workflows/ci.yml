name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR makes the running check meaningless; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS finish, so a failure shows whether it is OS-specific or not.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Chartula.slnx
      - run: dotnet build Chartula.slnx -c Release --no-restore -warnaserror
      - run: dotnet test Chartula.slnx -c Release --no-build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check formatting
        run: |
          dotnet format Chartula.slnx --verify-no-changes || {
            echo "::error::Formatting differs from .editorconfig. Run 'dotnet format Chartula.slnx' and commit the result."
            exit 1
          }
